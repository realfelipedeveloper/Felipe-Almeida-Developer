name: PR automático de hotfix para main

on:
  push:
    branches:
      - 'hotfix/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  abrir-pr:
    name: Abrir ou manter hotfix para main
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Abrir PR de hotfix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPOSITORIO: ${{ github.repository }}
        run: |
          set -euo pipefail

          EXISTENTE="$(gh pr list \
            --repo "$REPOSITORIO" \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "$EXISTENTE" ]]; then
            echo "PR de hotfix #$EXISTENTE já existe."
            exit 0
          fi

          TITULO="$(git log -1 --pretty=%s)"

          CORPO="$(cat <<EOF
          ## Hotfix

          Pull request aberto automaticamente para aplicar a correção emergencial da branch \`$BRANCH\` diretamente na \`main\`.

          ## Validações

          - [ ] CI concluído com sucesso
          - [ ] Correção emergencial revisada
          - [ ] Impacto em produção avaliado

          ## Retrointegração

          Após o merge, a automação criará uma branch de retrointegração para levar a correção de volta à \`develop\`.
          EOF
          )"

          URL="$(gh pr create \
            --repo "$REPOSITORIO" \
            --base main \
            --head "$BRANCH" \
            --title "$TITULO" \
            --body "$CORPO")"

          echo "PR criado: $URL"

          gh label create "hotfix" \
            --repo "$REPOSITORIO" \
            --color "b60205" \
            --description "Correção emergencial" \
            --force

          NUMERO="$(gh pr list --repo "$REPOSITORIO" --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          gh pr edit "$NUMERO" --repo "$REPOSITORIO" --add-label "hotfix"
