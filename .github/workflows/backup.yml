name: Backup de produção

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-producao
  cancel-in-progress: false

jobs:
  postgres:
    name: Backup PostgreSQL criptografado
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar segredos operacionais
        shell: bash
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$BACKUP_DATABASE_URL" ]] || { echo "::error::Configure BACKUP_DATABASE_URL."; exit 1; }
          [[ ${#BACKUP_ENCRYPTION_PASSPHRASE} -ge 32 ]] || { echo "::error::BACKUP_ENCRYPTION_PASSPHRASE deve ter ao menos 32 caracteres."; exit 1; }

      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Gerar backup
        shell: bash
        env:
          APP_ENV: production
          BACKUP_USE_DOCKER: 'false'
          BACKUP_DIR: ./backup-output
          BACKUP_RETENTION_DAYS: '14'
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: bash infra/scripts/backup.sh

      - name: Publicar backup privado
        uses: actions/upload-artifact@v4
        with:
          name: backup-postgresql-${{ github.run_id }}
          path: |
            backup-output/*.aesgcm
            backup-output/*.sha256
          retention-days: 14
          if-no-files-found: error
